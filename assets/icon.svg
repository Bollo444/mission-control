<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mission Control">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e12"/>
      <stop offset="1" stop-color="#0f131a"/>
    </linearGradient>
    <radialGradient id="iglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#46e0d0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#46e0d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ibg)"/>
  <rect width="512" height="512" rx="112" fill="url(#iglow)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#46e0d0" stroke-opacity="0.18" stroke-width="2"/>

  <!-- core mark ◎ -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#46e0d0" stroke-width="22"/>
  <circle cx="256" cy="256" r="44" fill="#46e0d0"/>

  <!-- orbiting fleet -->
  <g>
    <circle cx="256" cy="86" r="15" fill="#46e0d0"/>
    <circle cx="386" cy="126" r="15" fill="#6ea8fe"/>
    <circle cx="437" cy="256" r="15" fill="#9d8cff"/>
    <circle cx="386" cy="386" r="15" fill="#5cd6a0"/>
    <circle cx="256" cy="426" r="15" fill="#f5b75a"/>
    <circle cx="126" cy="386" r="15" fill="#f06a7a"/>
    <circle cx="75" cy="256" r="15" fill="#e879c7"/>
    <circle cx="126" cy="126" r="15" fill="#c7a86b"/>
  </g>
</svg>
